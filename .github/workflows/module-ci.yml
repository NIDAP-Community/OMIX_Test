name: Module CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  module-contract:
    name: Validate module contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Validate module manifests and folders
        run: Rscript tests/test-module-contract.R

  changed-module-summary:
    name: Report changed modules
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed modules
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "$base_sha" HEAD \
            | awk -F/ '/^modules\/[^/]+\// {print $2}' \
            | sort -u \
            | tee changed-modules.txt

          if [[ ! -s changed-modules.txt ]]; then
            echo "No module-specific changes detected."
          fi

