name: "Module CI"

on:
  pull_request:
    branches: [main, 'mod/**']
    paths:
      - 'modules/**'
      - 'core/**'
      - 'tests/**'
      - 'scripts/check_module_versioning.R'

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changed
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          MODULES=$(git diff --name-only "$BASE" HEAD -- 'modules/**' \
            | sed -n 's|^modules/\([^/]*\)/.*|\1|p' \
            | sort -u)

          if [ -z "$MODULES" ]; then
            echo "No module changes detected."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$MODULES" > /tmp/changed_modules.txt
            echo "Changed modules: $MODULES"
          fi

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Run contract validation
        run: Rscript tests/test-module-contract.R

      - name: Check module versioning
        if: steps.changed.outputs.has_changes == 'true' && github.event.pull_request.base.ref == 'main'
        run: Rscript scripts/check_module_versioning.R "${{ github.event.pull_request.base.sha }}"

      - name: Run smoke tests for changed modules
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          while IFS= read -r MODULE; do
            TEST_SCRIPT="modules/${MODULE}/runtime/tests/test_run_small.sh"
            if [ -f "$TEST_SCRIPT" ]; then
              echo "Running smoke test for $MODULE..."
              bash "$TEST_SCRIPT"
            else
              echo "No smoke test found for $MODULE, skipping."
            fi
          done < /tmp/changed_modules.txt
