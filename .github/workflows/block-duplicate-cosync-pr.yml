name: "Block Duplicate CO-Sync PR"

on:
  pull_request:
    types: [opened, reopened]
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'co-sync/')
    steps:
      - name: Extract module from branch name
        id: module
        run: |
          # co-sync/volcano-20250611-143000 -> volcano
          BRANCH="${{ github.head_ref }}"
          MODULE=$(echo "$BRANCH" | sed 's|^co-sync/||' | sed 's|-[0-9]\{8\}-[0-9]\{6\}$||')
          echo "name=$MODULE" >> "$GITHUB_OUTPUT"

      - name: Check for sibling co-sync PRs (same module)
        id: siblings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE="${{ steps.module.outputs.name }}"
          CURRENT_PR="${{ github.event.pull_request.number }}"

          SIBLINGS=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json number,headRefName \
            --jq "[.[] | select(.headRefName | startswith(\"co-sync/${MODULE}-\")) | select(.number != ${CURRENT_PR})] | length")

          echo "count=$SIBLINGS" >> "$GITHUB_OUTPUT"

      - name: Block if duplicate exists for same module
        if: steps.siblings.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODULE="${{ steps.module.outputs.name }}"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "⚠️ **Blocked:** Another co-sync PR for module \`${MODULE}\` is already open. Please merge or close that PR first.

          > Different modules can have concurrent co-sync PRs — this check only blocks duplicates for the *same* module."
          exit 1
