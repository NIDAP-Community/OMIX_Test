name: Starter Environments

on:
  pull_request:
    paths:
      - starter-environments/**
      - .github/workflows/starter-environments.yml
  push:
    branches:
      - main
    paths:
      - starter-environments/**
      - .github/workflows/starter-environments.yml

jobs:
  build:
    name: Build starter environment
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - r-base
          - r-visualization
          - r-pathway
          - r-singlecell

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build starter image
        uses: docker/build-push-action@v6
        with:
          context: starter-environments/${{ matrix.environment }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/nidap-community/omix-${{ matrix.environment }}:latest

